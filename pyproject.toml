[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corecoder"
version = "0.7.0"
description = "Extensible local coding-agent harness with tools, MCP, sandboxing, durable sessions, and sub-agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yufeng He", email = "40085740+he-yufeng@users.noreply.github.com" },
]
maintainers = [
    { name = "luluyuxiao" },
]
keywords = ["ai", "agent", "agent-harness", "coding", "cli", "llm", "mcp", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["corecoder"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
dev = ["pytest>=7.0", "ruff>=0.9.0"]

[project.scripts]
corecoder = "corecoder.cli:main"
corecoder-eval = "corecoder.eval:main"
corecoder-protect-paths = "corecoder.protect_paths_hook:main"

[project.urls]
Homepage = "https://github.com/luluyuxiao/CoreCoder"
Repository = "https://github.com/luluyuxiao/CoreCoder"
Issues = "https://github.com/luluyuxiao/CoreCoder/issues"

[tool.ruff]
line-length = 130
target-version = "py310"
